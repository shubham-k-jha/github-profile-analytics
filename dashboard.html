<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="GitHub portfolio analytics dashboard for shubham-k-jha">
<title>GitHub Analytics · shubham-k-jha</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#0d1117;--border:#30363d;--text:#f0f6fc;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;--purple:#bc8cff;--red:#f85149;--shadow:0 8px 24px #01040966}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#161b22 0,#0d1117 45%);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:32px 20px 50px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.identity{display:flex;gap:16px;align-items:center}.avatar{width:72px;height:72px;border-radius:50%;border:1px solid var(--border);box-shadow:var(--shadow)}h1{font-size:25px;margin:0}.muted{color:var(--muted)}button{background:#21262d;color:var(--text);border:1px solid var(--border);border-radius:7px;padding:8px 13px;cursor:pointer}button:hover{border-color:#8b949e}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card,.panel{background:linear-gradient(180deg,var(--panel),#12171d);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}.card{padding:16px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.value{font-size:25px;font-weight:700;margin-top:6px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}.panel{padding:18px}.panel h2{font-size:16px;margin:0 0 14px}.bars{height:190px;display:flex;align-items:end;gap:4px}.bar{flex:1;background:linear-gradient(180deg,var(--blue),#1f6feb);min-height:2px;border-radius:3px 3px 0 0;transition:opacity .15s}.bar:hover{opacity:.7}.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:8px}.lang{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:7px 0}.repo{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px}.repo a{color:var(--blue);text-decoration:none;font-weight:650}.repo a:hover{text-decoration:underline}.repo p{margin:5px 0;color:var(--muted);font-size:12px}.stats{font-size:12px;color:var(--muted)}.events{max-height:310px;overflow:auto}.event{padding:9px 0;border-bottom:1px solid var(--border)}code{color:var(--green)}.status{font-size:11px;color:var(--muted);margin-top:8px}.error{color:var(--red);padding:12px;border:1px solid #f8514944;border-radius:8px}
@media(max-width:950px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:560px){.cards{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.identity{align-items:flex-start}.avatar{width:58px;height:58px}}
</style></head>
<body><main class="wrap">
<div class="top"><div class="identity"><img id="avatar" class="avatar" alt="GitHub avatar"><div><h1>GitHub Analytics</h1><div id="bio" class="muted">@shubham-k-jha · portfolio dashboard</div><div id="status" class="status">Loading…</div></div></div><button id="refresh">↻ Refresh</button></div>
<div id="error"></div>
<section class="cards">
<div class="card"><div class="label">Profile views</div><div id="views" class="value">—</div></div>
<div class="card"><div class="label">Repositories</div><div id="repos" class="value">—</div></div>
<div class="card"><div class="label">Stars</div><div id="stars" class="value">—</div></div>
<div class="card"><div class="label">Forks</div><div id="forks" class="value">—</div></div>
<div class="card"><div class="label">Followers</div><div id="followers" class="value">—</div></div>
<div class="card"><div class="label">This month</div><div id="month" class="value">—</div></div>
</section>
<section class="grid">
<div class="panel"><h2>Profile views · last 30 days</h2><div id="bars" class="bars"></div><div id="axis" class="axis"></div></div>
<div class="panel"><h2>Languages</h2><div id="langs"></div></div>
<div class="panel"><h2>Top repositories</h2><div id="repoList"></div></div>
<div class="panel"><h2>Recent public activity</h2><div id="events" class="events"></div></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id), fmt=n=>Number(n||0).toLocaleString();
async function load(){
 $("status").textContent="Updating…"; $("error").innerHTML="";
 try{
  const [g,v]=await Promise.all([
   fetch("/api/github?username=shubham-k-jha",{cache:"no-store"}).then(r=>r.json()),
   fetch("/api/stats?username=shubham-k-jha",{cache:"no-store"}).then(r=>r.json())
  ]);
  if(g.error) throw new Error(g.error); if(v.error) throw new Error(v.error);
  $("avatar").src=g.profile.avatar; $("bio").textContent=`@${g.profile.login}${g.profile.bio?" · "+g.profile.bio:""}`;
  $("views").textContent=fmt(v.total); $("month").textContent=fmt(v.current_month);
  $("repos").textContent=fmt(g.summary.repositories); $("stars").textContent=fmt(g.summary.stars);
  $("forks").textContent=fmt(g.summary.forks); $("followers").textContent=fmt(g.profile.followers);
  const vals=Object.entries(v.daily), max=Math.max(1,...vals.map(x=>x[1]));
  $("bars").innerHTML=vals.map(([d,n])=>`<div class="bar" title="${d}: ${fmt(n)} views" style="height:${Math.max(2,n/max*100)}%"></div>`).join("");
  $("axis").innerHTML=`<span>${vals[0]?.[0]||""}</span><span>${vals.at(-1)?.[0]||""}</span>`;
  $("langs").innerHTML=Object.entries(g.languages).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="lang"><span>${k}</span><strong>${n}</strong></div>`).join("")||'<span class="muted">No language data</span>';
  $("repoList").innerHTML=g.repositories.slice(0,10).map(r=>`<div class="repo"><a href="${r.url}" target="_blank" rel="noopener">${r.name}</a>${r.description?`<p>${r.description}</p>`:""}<div class="stats">★ ${fmt(r.stars)} · forks ${fmt(r.forks)} · issues ${fmt(r.issues)}${r.language?" · "+r.language:""}</div></div>`).join("");
  $("events").innerHTML=g.activity.slice(0,20).map(e=>`<div class="event"><code>${e.type}</code> · ${e.repo||"GitHub"}<div class="muted">${new Date(e.created_at).toLocaleString()}</div></div>`).join("")||'<span class="muted">No recent public events returned by GitHub.</span>';
  $("status").textContent=`Updated ${new Date().toLocaleTimeString()}`;
 }catch(e){$("error").innerHTML=`<div class="error">${e.message||"Dashboard failed to load."}</div>`;$("status").textContent="Update failed";}
}
$("refresh").onclick=load; load();
</script></body></html>
